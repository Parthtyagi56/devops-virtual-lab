name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4


      - name: Verify Environment
        shell: powershell
        run: |
          Write-Host "Checking Docker..."
          docker --version

          Write-Host "Checking Minikube..."
          minikube status

          Write-Host "Checking Kubernetes..."
          kubectl get nodes


      - name: Build Docker Image in Minikube
        shell: powershell
        run: |
          minikube image build -t devops-lab-app:latest ./app


      - name: Verify Docker Image
        shell: powershell
        run: |
          minikube image ls | Select-String "devops-lab-app"


      - name: Deploy to Kubernetes
        shell: powershell
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml


      - name: Restart Application Deployment
        shell: powershell
        run: |
          kubectl rollout restart deployment/devops-app
          kubectl rollout status deployment/devops-app --timeout=120s


      - name: Verify Kubernetes Deployment
        shell: powershell
        run: |
          Write-Host "DEPLOYMENT"
          kubectl get deployments

          Write-Host "PODS"
          kubectl get pods

          Write-Host "SERVICE"
          kubectl get services


      - name: Pipeline Complete
        shell: powershell
        run: |
          Write-Host "DevOps Virtual Lab Experiment 5"
          Write-Host "CI/CD deployment completed successfully."